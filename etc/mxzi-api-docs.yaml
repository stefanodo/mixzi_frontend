    "/auth/register": {
      "post": {
        "description": "Creates the Auth user only — no tenant, no user_profiles row yet. Returns a session (access/refresh token) exactly like a normal login. The returned access_token has no tenant_id claim; call POST /auth/complete-registration next, then obtain a NEW token (see that endpoint) before the claim appears. termsAccepted/termsVersion are required here (this is where the UI shows the checkbox — personal data starts being processed at this step) but aren't persisted until complete-registration, since user_profiles doesn't exist yet; they travel via the JWT's app_metadata claim in the meantime (not user_metadata — that's user-editable and unsuitable for evidence, see CLAUDE.md).",
        "operationId": "AuthController_register",
        "parameters": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RegisterDto"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RegisterResponseDto"
                }
              }
            }
          },
          "400": {
            "description": "termsAccepted was not true, or termsVersion does not match the version the backend currently recognizes as current\n\nThe request body failed validation (missing field, wrong type, disallowed value, ...). `fields` details each violation: `field` is the property name (dot-path if nested), `code` a stable identifier of the error type — see FieldErrorCode in src/common/errors/field-error-codes.ts.",
            "content": {
              "application/json": {
                "schema": {
                  "example": {
                    "statusCode": 400,
                    "code": "VALIDATION_ERROR",
                    "fields": [
                      {
                        "field": "name",
                        "code": "REQUIRED"
                      }
                    ]
                  }
                }
              }
            }
          },
          "409": {
            "description": "An account with this email already exists",
            "content": {
              "application/json": {
                "schema": {
                  "example": {
                    "statusCode": 409,
                    "code": "EMAIL_ALREADY_REGISTERED"
                  }
                }
              }
            }
          },
          "429": {
            "description": "The allowed request limit for this endpoint was exceeded",
            "content": {
              "application/json": {
                "schema": {
                  "example": {
                    "statusCode": 429,
                    "code": "RATE_LIMITED"
                  }
                }
              }
            }
          }
        },
        "summary": "Create a Supabase Auth account (step 1 of 2)",
        "tags": [
          "Auth"
        ]
      }
    },
    "/auth/complete-registration": {
      "post": {
        "description": "Requires the access_token from POST /auth/register (or any valid token for a user without a tenant yet). Persists the terms_accepted_at/termsVersion that were captured in step one (carried in this token's app_metadata claim, not resent in this body — see CLAUDE.md), creates the tenant (owned by the calling user), activates planId immediately (no payment gate in this beta phase), and stamps trial_started_at. The response's requiresNewToken always being true is the important part for the frontend: the JWT used to call this endpoint keeps tenant_id absent even after this succeeds — request a new one (refresh-token grant or re-login) before relying on that claim.",
        "operationId": "AuthController_completeRegistration",
        "parameters": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CompleteRegistrationDto"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CompleteRegistrationResponseDto"
                }
              }
            }
          },
          "400": {
            "description": "termsAccepted was not true, or termsVersion does not match the version the backend currently recognizes as current\n\nThe request body failed validation (missing field, wrong type, disallowed value, ...). `fields` details each violation: `field` is the property name (dot-path if nested), `code` a stable identifier of the error type — see FieldErrorCode in src/common/errors/field-error-codes.ts.",
            "content": {
              "application/json": {
                "schema": {
                  "example": {
                    "statusCode": 400,
                    "code": "VALIDATION_ERROR",
                    "fields": [
                      {
                        "field": "name",
                        "code": "REQUIRED"
                      }
                    ]
                  }
                }
              }
            }
          },
          "401": {
            "description": "The JWT is missing, invalid, or expired",
            "content": {
              "application/json": {
                "schema": {
                  "example": {
                    "statusCode": 401,
                    "code": "UNAUTHENTICATED"
                  }
                }
              }
            }
          },
          "404": {
            "description": "planId does not match any existing plan",
            "content": {
              "application/json": {
                "schema": {
                  "example": {
                    "statusCode": 404,
                    "code": "PLAN_NOT_FOUND"
                  }
                }
              }
            }
          },
          "409": {
            "description": "The authenticated user already has a tenant — this endpoint is only for finishing an in-progress signup",
            "content": {
              "application/json": {
                "schema": {
                  "example": {
                    "statusCode": 409,
                    "code": "TENANT_ALREADY_ASSIGNED"
                  }
                }
              }
            }
          },
          "429": {
            "description": "The allowed request limit for this endpoint was exceeded",
            "content": {
              "application/json": {
                "schema": {
                  "example": {
                    "statusCode": 429,
                    "code": "RATE_LIMITED"
                  }
                }
              }
            }
          }
        },
        "security": [
          {
            "bearer": []
          }
        ],
        "summary": "Create the tenant and activate a plan (step 2 of 2)",
        "tags": [
          "Auth"
        ]
      }
    },
    "/auth/verify-login-code": {
      "post": {
        "description": "Call this after a login attempt fails with GoTrue's ACCOUNT_LOCKED_VERIFY_EMAIL message (5 consecutive failed password attempts — see CLAUDE.md's Password Verification Attempt Hook design note). Triggers Supabase Auth's own Email OTP send (POST /auth/v1/otp under the hood) using the mailer already configured for the project. Always responds 200 with an empty body, whether or not the email belongs to a real account — this endpoint never confirms or denies that.",
        "operationId": "AuthController_verifyLoginCode",
        "parameters": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/VerifyLoginCodeDto"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Always returned, regardless of outcome"
          },
          "400": {
            "description": "The request body failed validation (missing field, wrong type, disallowed value, ...). `fields` details each violation: `field` is the property name (dot-path if nested), `code` a stable identifier of the error type — see FieldErrorCode in src/common/errors/field-error-codes.ts.",
            "content": {
              "application/json": {
                "schema": {
                  "example": {
                    "statusCode": 400,
                    "code": "VALIDATION_ERROR",
                    "fields": [
                      {
                        "field": "name",
                        "code": "REQUIRED"
                      }
                    ]
                  }
                }
              }
            }
          },
          "429": {
            "description": "The allowed request limit for this endpoint was exceeded",
            "content": {
              "application/json": {
                "schema": {
                  "example": {
                    "statusCode": 429,
                    "code": "RATE_LIMITED"
                  }
                }
              }
            }
          }
        },
        "summary": "Send an email verification code to unlock a locked account",
        "tags": [
          "Auth"
        ]
      }
    },
    "/auth/confirm-login-code": {
      "post": {
        "description": "Verifies the code against Supabase Auth (POST /auth/v1/verify, type=email) and, if valid, clears the account's failed-login lock (mixziapp.login_attempts.failed_count -\u003E 0) so the next password attempt is no longer rejected. A valid code IS a real Supabase Auth sign-in under the hood, so the response is a full session — the client can use it directly instead of being forced to retry the password login a second time.",
        "operationId": "AuthController_confirmLoginCode",
        "parameters": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ConfirmLoginCodeDto"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ConfirmLoginCodeResponseDto"
                }
              }
            }
          },
          "400": {
            "description": "The code is wrong, expired, or does not match this email\n\nThe request body failed validation (missing field, wrong type, disallowed value, ...). `fields` details each violation: `field` is the property name (dot-path if nested), `code` a stable identifier of the error type — see FieldErrorCode in src/common/errors/field-error-codes.ts.",
            "content": {
              "application/json": {
                "schema": {
                  "example": {
                    "statusCode": 400,
                    "code": "VALIDATION_ERROR",
                    "fields": [
                      {
                        "field": "name",
                        "code": "REQUIRED"
                      }
                    ]
                  }
                }
              }
            }
          },
          "429": {
            "description": "The allowed request limit for this endpoint was exceeded",
            "content": {
              "application/json": {
                "schema": {
                  "example": {
                    "statusCode": 429,
                    "code": "RATE_LIMITED"
                  }
                }
              }
            }
          }
        },
        "summary": "Confirm the code from POST /auth/verify-login-code",
        "tags": [
          "Auth"
        ]
      }
    },
