  "info": {
    "title": "Mixzi API",
    "description": "Core Mixzi API — Back of House management for restaurants",
    "version": "0.0.1",
    "contact": {

    }
  },
  "tags": [],
  "servers": [],
  "components": {
    "securitySchemes": {
      "bearer": {
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "type": "http"
      }
    },
    "schemas": {
      "RegisterDto": {
        "type": "object",
        "properties": {
          "firstName": {
            "type": "string",
            "example": "Juan"
          },
          "lastName": {
            "type": "string",
            "example": "Pérez"
          },
          "email": {
            "type": "string",
            "example": "juan.perez@example.com"
          },
          "password": {
            "type": "string",
            "example": "SuperSecreta123!",
            "description": "Minimum 8 characters. No other complexity rule enforced yet."
          },
          "termsAccepted": {
            "type": "boolean",
            "example": true,
            "description": "Must be true — the UI shows this checkbox at this step because this is where personal data starts being processed. false or missing is rejected with 400 TERMS_NOT_ACCEPTED (not a generic validation error, so the frontend can show a dedicated message)."
          },
          "termsVersion": {
            "type": "string",
            "example": "v1",
            "description": "Identifier of the T&C version shown to the user. Must match the version the backend currently recognizes as current (see CURRENT_TERMS_VERSION) — a mismatch is rejected the same way as termsAccepted: false (400 TERMS_NOT_ACCEPTED), since a stale frontend showing an outdated document needs the same fix: reload and re-accept the current one."
          }
        },
        "required": [
          "firstName",
          "lastName",
          "email",
          "password",
          "termsAccepted",
          "termsVersion"
        ]
      },
      "RegisterResponseDto": {
        "type": "object",
        "properties": {
          "accessToken": {
            "type": "string",
            "description": "Supabase Auth JWT — tenant_id claim absent"
          },
          "refreshToken": {
            "type": "string"
          },
          "expiresIn": {
            "type": "number",
            "example": 3600
          },
          "tokenType": {
            "type": "string",
            "example": "bearer"
          },
          "userId": {
            "type": "string",
            "description": "Supabase Auth user ID (auth.users.id)"
          },
          "email": {
            "type": "string"
          }
        },
        "required": [
          "accessToken",
          "refreshToken",
          "expiresIn",
          "tokenType",
          "userId",
          "email"
        ]
      },
      "CompleteRegistrationDto": {
        "type": "object",
        "properties": {
          "restaurantName": {
            "type": "string",
            "example": "Restaurante El Buen Sabor"
          },
          "address": {
            "type": "string",
            "example": "Av. Siempreviva 742, CABA"
          },
          "postalCode": {
            "type": "string",
            "example": "1414"
          },
          "planId": {
            "type": "string",
            "example": "a1b2c3d4-5678-4abc-9def-000000000099",
            "description": "ID of an existing plan (must exist in plans)"
          }
        },
        "required": [
          "restaurantName",
          "planId"
        ]
      },
      "CompleteRegistrationResponseDto": {
        "type": "object",
        "properties": {
          "tenantId": {
            "type": "string",
            "description": "ID of the newly created tenant"
          },
          "requiresNewToken": {
            "type": "boolean",
            "example": true,
            "description": "Always true right now — kept as an explicit field (not a comment the frontend has to remember) because it's easy to get wrong: the JWT used to CALL this endpoint still has tenant_id absent after this returns. custom_access_token_hook only reads user_profiles at TOKEN ISSUANCE time, and this endpoint just created that row — it doesn't retroactively change an already-issued token. The client must obtain a new one (refresh-token grant, or a fresh login) before tenant_id shows up in a JWT claim."
          }
        },
        "required": [
          "tenantId",
          "requiresNewToken"
        ]
      },
      "VerifyLoginCodeDto": {
        "type": "object",
        "properties": {
          "email": {
            "type": "string",
            "example": "juan.perez@example.com",
            "description": "Email of the account currently rejecting logins with ACCOUNT_LOCKED_VERIFY_EMAIL. This endpoint always responds the same way whether or not the email belongs to a real account — it never confirms or denies an email's existence."
          }
        },
        "required": [
          "email"
        ]
      },
      "ConfirmLoginCodeDto": {
        "type": "object",
        "properties": {
          "email": {
            "type": "string",
            "example": "juan.perez@example.com"
          },
          "code": {
            "type": "string",
            "example": "123456",
            "description": "The code sent by POST /auth/verify-login-code. Length is not hardcoded to 6 here — GoTrue is the actual source of truth for what a valid code looks like, this is just a sane upper bound."
          }
        },
        "required": [
          "email",
          "code"
        ]
      },
      "ConfirmLoginCodeResponseDto": {
        "type": "object",
        "properties": {
          "accessToken": {
            "type": "string",
            "description": "Supabase Auth JWT for the now-unlocked account"
          },
          "refreshToken": {
            "type": "string"
          },
          "expiresIn": {
            "type": "number",
            "example": 3600
          },
          "tokenType": {
            "type": "string",
            "example": "bearer"
          },
          "userId": {
            "type": "string",
            "description": "Supabase Auth user ID (auth.users.id)"
          },
          "email": {
            "type": "string"
          }
        },
        "required": [
          "accessToken",
          "refreshToken",
          "expiresIn",
          "tokenType",
          "userId",
          "email"
        ]
      },
      "ItemResponseDto": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "example": "b3f1c2a0-1234-4abc-9def-56789abcdef0",
            "description": "Item ID"
          },
          "tenantId": {
            "type": "string",
            "example": "a1b2c3d4-5678-4abc-9def-000000000000",
            "description": "Owning tenant ID"
          },
          "name": {
            "type": "string",
            "example": "Harina 000"
          },
          "unit": {
            "type": "string",
            "example": "kg"
          },
          "category": {
            "type": "object",
            "example": "Secos",
            "nullable": true
          },
          "minStock": {
            "type": "object",
            "example": 5,
            "nullable": true
          },
          "maxStock": {
            "type": "object",
            "example": 50,
            "nullable": true
          },
          "wasteDefaultPct": {
            "type": "object",
            "example": 3.5,
            "nullable": true
          },
          "isActive": {
            "type": "boolean",
            "example": true
          },
          "createdAt": {
            "format": "date-time",
            "type": "string",
            "example": "2026-08-21T10:00:00.000Z"
          },
          "updatedAt": {
            "format": "date-time",
            "type": "string",
            "example": "2026-08-21T10:00:00.000Z"
          }
        },
        "required": [
          "id",
          "tenantId",
          "name",
          "unit",
          "isActive",
          "createdAt",
          "updatedAt"
        ]
      },
      "CreateItemDto": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "example": "Harina 000",
            "description": "Item name"
          },
          "unit": {
